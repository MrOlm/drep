name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: drep-test
          python-version: "3.10"

      - name: Install dependencies
        run: |
          conda install -y -c bioconda -c conda-forge mash skani prodigal pplacer fastani mummer4
          pip install checkm-genome
          pip install -e .

      - name: Run tests
        run: pytest tests/
