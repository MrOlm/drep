name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - python-version: "3.10"
            pandas-version: "<3.0"
          - python-version: "3.12"
            pandas-version: ">=3.0"

    name: Python ${{ matrix.python-version }} / pandas ${{ matrix.pandas-version }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: drep-test
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          conda install -y -c bioconda -c conda-forge mash skani prodigal pplacer fastani "mummer4=4.0.0rc1"
          pip install checkm-genome
          pip install "pandas${{ matrix.pandas-version }}"
          pip install -e .

      - name: Run tests
        run: pytest tests/
